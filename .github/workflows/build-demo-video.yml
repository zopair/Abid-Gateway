name: Build Insta Freelancer Demo Video

on:
  push:
    branches: [main]
    paths:
      - "render_demo.py"
      - "build_video.sh"
      - ".github/workflows/build-demo-video.yml"
  pull_request:
    branches: [main]
    paths:
      - "render_demo.py"
      - "build_video.sh"
      - ".github/workflows/build-demo-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install open-source rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Render demo scenes and MP4
        run: |
          python render_demo.py
          bash build_video.sh
      - name: Upload generated demo video
        uses: actions/upload-artifact@v4
        with:
          name: nexapay-demo-video
          path: media/insta-freelancer-demo.mp4
          if-no-files-found: error
          retention-days: 14
