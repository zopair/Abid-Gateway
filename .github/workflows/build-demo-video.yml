name: Build Insta Freelancer Demo Video

on:
  push:
    branches: [main]
    paths:
      - "render_demo.py"
      - "build_video.sh"
      - ".github/workflows/build-demo-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install open-source rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Render demo scenes and MP4
        run: |
          python render_demo.py
          bash build_video.sh
      - name: Commit generated demo video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/insta-freelancer-demo.mp4
          if git diff --cached --quiet; then
            echo "Demo video is already up to date."
          else
            git commit -m "Add Insta Freelancer demo video"
            git push
          fi
